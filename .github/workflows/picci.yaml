name: Build cross-platform codebase

on:
  push:
    branches:
      - master
    paths:
      - 'include/**'
      - 'src/**'
      - 'config/assets.*.yaml'
      - 'tools/sotn-assets/**'
      - 'cmake/**'
      - 'CMakeLists*'
      - 'Makefile*'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'config/assets.*.yaml'
      - 'tools/sotn-assets/**'
      - 'cmake/**'
      - 'CMakeLists*'
      - 'Makefile*'
  workflow_dispatch:

env:
  DEMOS: "0 3 6"

jobs:
  build-linux:
    if: github.repository == 'Xeeynamo/sotn-decomp'
    strategy:
      matrix:
        compiler: ["gcc"]
        build_type: ["RelWithDebInfo"]
        standard: ["c99"]
        arch: ["x86_64"]
    runs-on: ubuntu-24.04
    steps:
      - name: Install requirements
        run: sudo apt-get update && sudo apt-get install build-essential libsdl2-dev libxtst-dev mesa-vulkan-drivers libvulkan1
      - name: Install multilib
        if: matrix.arch == 'i686'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install gcc-multilib g++-multilib libsdl2-dev:i386
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: false
      - name: Clone psyz backend
        run: |
          git submodule update --init tools/psyz
          cd tools/psyz
          git submodule update --init --recursive external/SDL
      - name: Get dependencies
        uses: ./.github/actions/get-dependencies
        with:
          token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
      - name: Generate assets
        run: |
          make extract_assets
          make build_assets
      - name: Build
        run: |
          if [[ "${{ matrix.arch }}" == "i686" ]]; then
            export PC_FLAGS="-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32"
          fi
          export CC=${{ matrix.compiler }}
          cmake -B ${{github.workspace}}/pc $PC_FLAGS -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_ASAN=OFF
          cmake --build ${{github.workspace}}/pc --config ${{ matrix.build_type }}
      - name: Test demo playback
        timeout-minutes: 10
        env:
          SDL_VIDEODRIVER: "offscreen"
          SDL_AUDIODRIVER: dummy
        run: |
          for demo in $DEMOS; do
            echo "::group::demo $demo"
            ${{github.workspace}}/pc/sotn --demo $demo --replay-fast --replay-and-exit
            echo "::endgroup::"
          done

  build-macos:
    if: github.repository == 'Xeeynamo/sotn-decomp'
    strategy:
      matrix:
        build_type: ["RelWithDebInfo"]
    runs-on: macos-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: false
      - name: Clone psyz backend
        run: |
          git submodule update --init tools/psyz
          cd tools/psyz
          git submodule update --init --recursive external/SDL
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.work'
          cache: true
          cache-dependency-path: "**/*.sum"
      - name: Get dependencies
        uses: ./.github/actions/get-dependencies
        with:
          token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
      - name: Generate assets
        run: |
          make extract_assets
          make build_assets
      - name: Build
        run: |
          cmake -B ${{github.workspace}}/pc -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_ASAN=OFF
          cmake --build ${{github.workspace}}/pc --config ${{ matrix.build_type }}
      - name: Test demo playback
        timeout-minutes: 10
        env:
          SDL_VIDEODRIVER: ""
          SDL_AUDIODRIVER: dummy
        run: |
          for demo in $DEMOS; do
            echo "::group::demo $demo"
            ${{github.workspace}}/pc/sotn --demo $demo --replay-fast --replay-and-exit
            echo "::endgroup::"
          done

  build-windows:
    if: github.repository == 'Xeeynamo/sotn-decomp'
    strategy:
      matrix:
        build_type: ["RelWithDebInfo"]
    runs-on: windows-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        submodules: false
    - name: Clone psyz backend
      run: |
        git submodule update --init tools/psyz
        cd tools/psyz
        git submodule update --init --recursive external/SDL
    - name: Get dependencies
      uses: ./.github/actions/get-dependencies
      with:
        token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
    - uses: actions/setup-go@v7
      with:
        go-version: '^1.22.4'
    - name: Generate assets
      run: |
        cd tools/sotn-assets; go install; cd -
        $SOTN_ASSETS = (Get-Command sotn-assets).Source
        make extract_assets
        & make build_assets SOTNASSETS=$SOTN_ASSETS
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/pc -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        cmake --build ${{github.workspace}}/pc --config ${{ matrix.build_type }}
    - name: Test demo playback
      timeout-minutes: 10
      shell: bash
      env:
        SDL_VIDEODRIVER: offscreen
        SDL_AUDIODRIVER: dummy
      run: |
        sotn_exe=$(find "${{github.workspace}}/pc" -maxdepth 2 -iname 'sotn.exe' -print -quit)
        for demo in $DEMOS; do
          echo "::group::demo $demo"
          "$sotn_exe" --demo $demo --replay-fast --replay-and-exit
          echo "::endgroup::"
        done
