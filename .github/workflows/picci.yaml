name: Build cross-platform codebase

on:
  push:
    branches:
      - master
    paths:
      - 'include/**'
      - 'src/**'
      - 'config/assets.*.yaml'
      - 'tools/sotn-assets/**'
      - 'cmake/**'
      - 'CMakeLists*'
      - 'Makefile*'
      - '.github/workflows/picci.yaml'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'config/assets.*.yaml'
      - 'tools/sotn-assets/**'
      - 'cmake/**'
      - 'CMakeLists*'
      - 'Makefile*'
      - '.github/workflows/picci.yaml'
  workflow_dispatch:

jobs:
  build-linux:
    if: github.repository == 'Xeeynamo/sotn-decomp'
    strategy:
      matrix:
        compiler: ["gcc"]
        build_type: ["RelWithDebInfo"]
        standard: ["c99"]
        arch: ["x86_64"]
    runs-on: ubuntu-24.04
    steps:
      - name: Install requirements
        run: sudo apt-get update && sudo apt-get install build-essential libsdl2-dev libxtst-dev mesa-vulkan-drivers libvulkan1
      - name: Install multilib
        if: matrix.arch == 'i686'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install gcc-multilib g++-multilib libsdl2-dev:i386
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: false
      - name: Clone psyz backend
        run: |
          git submodule update --init tools/psyz
          cd tools/psyz
          git submodule update --init --recursive external/SDL
      - name: Get dependencies
        uses: ./.github/actions/get-dependencies
        with:
          token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
      - name: Generate assets
        run: |
          make extract_assets
          make build_assets
      - name: Build
        run: |
          if [[ "${{ matrix.arch }}" == "i686" ]]; then
            export PC_CMAKE_FLAGS="-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32"
          fi
          export CC=${{ matrix.compiler }}
          make pc PC_BUILD_TYPE=${{ matrix.build_type }}
      - name: Test demo playback
        timeout-minutes: 15
        env:
          SDL_VIDEODRIVER: "offscreen"
        run: make pc-test-demos -j

  build-macos:
    if: github.repository == 'Xeeynamo/sotn-decomp'
    strategy:
      matrix:
        build_type: ["RelWithDebInfo"]
    runs-on: macos-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: false
      - name: Clone psyz backend
        run: |
          git submodule update --init tools/psyz
          cd tools/psyz
          git submodule update --init --recursive external/SDL
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.work'
          cache: true
          cache-dependency-path: "**/*.sum"
      - name: Get dependencies
        uses: ./.github/actions/get-dependencies
        with:
          token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
      - name: Generate assets
        run: |
          make extract_assets
          make build_assets
      - name: Build
        run: make pc PC_BUILD_TYPE=${{ matrix.build_type }}
      - name: Test demo playback
        timeout-minutes: 15
        env:
          SDL_VIDEODRIVER: ""
        run: make pc-test-demos -j

  build-windows:
    if: github.repository == 'Xeeynamo/sotn-decomp'
    strategy:
      matrix:
        build_type: ["RelWithDebInfo"]
    runs-on: windows-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        submodules: false
    - name: Clone psyz backend
      run: |
        git submodule update --init tools/psyz
        cd tools/psyz
        git submodule update --init --recursive external/SDL
    - name: Get dependencies
      uses: ./.github/actions/get-dependencies
      with:
        token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
    - uses: actions/setup-go@v7
      with:
        go-version: '^1.22.4'
    - name: Generate assets
      run: |
        cd tools/sotn-assets; go install; cd -
        $SOTN_ASSETS = (Get-Command sotn-assets).Source
        make extract_assets
        & make build_assets SOTNASSETS=$SOTN_ASSETS
    - name: Build
      run: make pc PC_BUILD_TYPE=${{ matrix.build_type }}
    - name: Test demo playback
      timeout-minutes: 15
      shell: bash
      run: make pc-test-demos -j
