name: Build PSX, PSP and Saturn versions

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request_target:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      saturn_compiler:
        description: Saturn compiler backend
        type: choice
        options:
          - native64
          - dos
        default: native64
      psp_compiler:
        description: PSP compiler backend
        type: choice
        options:
          - native64
          - wibo
        default: native64

concurrency:
  group: ${{ github.ref }}-${{ github.job }}-${{ github.event_name }}-${{ github.number }}
  cancel-in-progress: false

jobs:
  build-and-test:
    strategy:
      matrix:
        version: ["us", "hd", "jp10", "jp11", "jp12", "usproto", "eu", "hk", "pspeu"]
    # Building and testing cannot work if the repository owner is not Xeeynamo
    # due to the missing secrets to clone the CI dependencies
    if: github.repository == 'Xeeynamo/sotn-decomp'
    runs-on: ubuntu-24.04
    environment: ${{ (github.event_name != 'pull_request_target' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) && '' || 'ci-secrets' }}
    env:
      VERSION: ${{ matrix.version }}
      SOTN_PSP_COMPILER: ${{ inputs.psp_compiler || 'native64' }}
      FROGRESS_API_BASE_URL: ${{ secrets.FROGRESS_API_BASE_URL }}
      FROGRESS_API_SECRET: ${{ secrets.FROGRESS_API_SECRET }}
      DISCORD_PROGRESS_WEBHOOK: ${{ secrets.DISCORD_PROGRESS_WEBHOOK }}
    steps:
      - name: Clone main repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.work'
          cache: true
          cache-dependency-path: "**/*.sum"
      - name: Install requirements
        run: sudo apt-get install binutils-mipsel-linux-gnu
      - name: Setup tools
        uses: ./.github/actions/setup-tools
      - name: Get dependencies
        uses: ./.github/actions/get-dependencies
        with:
          token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
      - name: Build binaries and check if they match
        run: make build
      - name: Generate progress report
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: make progress-report
      - name: Upload progress report
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.version }}_report
          path: build/${{ matrix.version }}/report.json
      - name: Remove clutter from build folder
        run: rm -rf build/${{ matrix.version }}/asm build/${{ matrix.version }}/src build/${{ matrix.version }}/assets
      - name: Export build folder
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: build_${{ matrix.version }}
          path: build/${{ matrix.version }}
      - name: Report progress (dry run)
        if: github.ref != 'refs/heads/master'
        run: .venv/bin/python3 tools/progress.py --dry-run --version ${{ matrix.version }}
      # frogress only tracks us, hd and pspeu
      - name: Report progress (online)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && contains(fromJSON('["us", "hd", "pspeu"]'), matrix.version)
        run: .venv/bin/python3 tools/progress.py --version ${{ matrix.version }}

  # unlike the matrix build above, this task builds all versions of the
  # game from the same build graph
  build-all:
    # Building and testing cannot work if the repository owner is not Xeeynamo
    # due to the missing secrets to clone the CI dependencies
    if: github.repository == 'Xeeynamo/sotn-decomp'
    runs-on: ubuntu-24.04
    # Gate secret access behind a manual-approval environment for untrusted
    # authors; owners, org members and collaborators run without the gate.
    environment: ${{ (github.event_name != 'pull_request_target' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) && '' || 'ci-secrets' }}
    env:
      DISCORD_PROGRESS_WEBHOOK: ${{ secrets.DISCORD_PROGRESS_WEBHOOK }}
      SOTN_PSP_COMPILER: ${{ inputs.psp_compiler || 'native64' }}
    steps:
      - name: Install requirements
        run: sudo apt-get install binutils-mipsel-linux-gnu
      - name: Clone main repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.work'
          cache: true
          cache-dependency-path: "**/*.sum"
      - name: Setup tools
        uses: ./.github/actions/setup-tools
      - name: Get dependencies
        uses: ./.github/actions/get-dependencies
        with:
          token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
      - name: Build binaries and check if they match
        run: make

  build-and-test-saturn:
    # Building and testing cannot work if the repository owner is not Xeeynamo
    # due to the missing secrets to clone the game's data repository
    if: github.repository == 'Xeeynamo/sotn-decomp'
    runs-on: ubuntu-24.04
    environment: ${{ (github.event_name != 'pull_request_target' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) && '' || 'ci-secrets' }}
    env:
      SOTN_SATURN_COMPILER: ${{ inputs.saturn_compiler || 'native64' }}
    steps:
      - name: Clone main repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
          submodules: false
      - name: Get dependencies
        uses: ./.github/actions/get-dependencies
        with:
          token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
      - name: Install build tools
        run: |
          sudo apt-get install bchunk binutils-sh-elf
      - name: Install dosemu
        if: env.SOTN_SATURN_COMPILER == 'dos'
        run: |
          git clone https://github.com/sozud/dosemu-deb.git
          cd dosemu-deb
          sudo apt-get install xfonts-utils
          sudo dpkg -i fdpp_1.6-1_amd64.deb
          sudo dpkg -i fdpp-dev_1.6-1_amd64.deb
          sudo dpkg -i comcom32_0.1~alpha3-1_all.deb
          sudo dpkg -i dosemu2_2.0~pre9-1_amd64.deb
      - name: Build saturn
        run: ./sotn.sh build saturn
      - name: Get satz
        run: git submodule update --init --recursive tools/saturn/satz
      - name: Build the native port
        run: .venv/bin/python3 tools/saturn_satz/build.py --no-sanitize
      - name: Generate progress report
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: ./sotn.sh progress saturn
      - name: Upload progress report
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: saturn_report
          path: build/saturn/report.json

  function-finder-saturn:
    if: github.repository == 'Xeeynamo/sotn-decomp' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone main repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
          submodules: false
      - name: Get dependencies
        uses: ./.github/actions/get-dependencies
        with:
          token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
      - name: Install build tools
        run: |
          sudo apt-get install bchunk binutils-sh-elf
      - name: Build saturn
        run: ./sotn.sh build saturn
      - name: Clone asset repository
        uses: actions/checkout@v7
        with:
          ref: 'gh-functions-saturn'
          path: 'gh-functions-saturn'
      - name: Set-up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install secondary pre-requirements
        run: |
            python3 -m venv .venv
            .venv/bin/pip install requests tabulate
      - name: Generate duplicates and function report
        run: .venv/bin/python3 tools/function_finder/function_finder_saturn.py --no-fetch > gh-functions-saturn/functions_saturn.md
      - name: Commit all reports
        run: |
            git config --global user.name 'GitHub Action'
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Update reports' || true
            git push
        working-directory: gh-functions-saturn

  generate-duplicates-report:
    strategy:
      matrix:
        version: ["us"]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ matrix.version }}
      SOTN_PSP_COMPILER: ${{ inputs.psp_compiler || 'native64' }}
    steps:
      - name: Install requirements
        run: sudo apt-get install binutils-mipsel-linux-gnu
      - name: Clone main repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup tools
        uses: ./.github/actions/setup-tools
      - name: Get dependencies
        uses: ./.github/actions/get-dependencies
        with:
          token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
      - name: Obtain built binaries
        uses: actions/download-artifact@v8
        with:
          name: build_${{ matrix.version }}
          path: build/${{ matrix.version }}
      - name: Clone asset repository
        uses: actions/checkout@v7
        with:
          ref: 'gh-duplicates'
          path: 'gh-duplicates'
      - name: Set-up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install secondary pre-requirements
        run: |
            make python-dependencies & \
            (sudo apt-get update && sudo apt-get install graphviz) & \
            wait
      - name: Generate reports
        run: |
          make reports
      - name: Publish reports
        run: |
          mkdir -p gh-duplicates
          cp -r build/us/reports/* gh-duplicates/
      - name: Commit all reports
        run: |
            git config --global user.name 'GitHub Action'
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Update reports' || true
            git push
        working-directory: gh-duplicates

  generate-duplicates-report-psp:
    strategy:
      matrix:
        version: ["pspeu"]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ matrix.version }}
      SOTN_PSP_COMPILER: ${{ inputs.psp_compiler || 'native64' }}
    steps:
      - name: Install requirements
        run: sudo apt-get install binutils-mipsel-linux-gnu
      - name: Clone main repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup tools
        uses: ./.github/actions/setup-tools
      - name: Get dependencies
        uses: ./.github/actions/get-dependencies
        with:
          token: ${{ secrets.SOTN_DECOMP_DEPENDENCIES_TOKEN }}
      - name: Obtain built binaries
        uses: actions/download-artifact@v8
        with:
          name: build_${{ matrix.version }}
          path: build/${{ matrix.version }}
      - name: Clone asset repository
        uses: actions/checkout@v7
        with:
          ref: 'gh-duplicates-${{ matrix.version }}'
          path: 'gh-duplicates'
      - name: Set-up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install secondary pre-requirements
        run: |
            make python-dependencies &
            (sudo apt-get update && sudo apt-get install graphviz) & \
            wait
      - name: Generate function report
        run: |
            make clean && make build
            find asm -print
            .venv/bin/python3 tools/function_finder/function_finder_psp.py --no-fetch > gh-duplicates/functions.md
      - name: Commit all reports
        run: |
            git config --global user.name 'GitHub Action'
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Update reports' || true
            git push
        working-directory: gh-duplicates
