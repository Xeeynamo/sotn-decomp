name: 'Setup MSVC'
description: 'Make the Visual Studio x64 build tools (cl, link, INCLUDE, LIB) available to the next steps'

runs:
  using: 'composite'
  steps:
    - name: Export vcvars64 environment
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -property installationPath
        $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found in '$vs'" }

        $current = @{}
        Get-ChildItem env: | ForEach-Object { $current[$_.Name] = $_.Value }

        $lines = cmd /c "`"$vcvars`" >nul && set"
        if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
        foreach ($line in $lines) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name, $value = $Matches[1], $Matches[2]
            if ($name -ieq 'Path') {
                $known = $current['Path'] -split ';'
                foreach ($entry in ($value -split ';')) {
                    if ($entry -and ($known -notcontains $entry)) {
                        Add-Content -Path $env:GITHUB_PATH -Value $entry -Encoding utf8
                    }
                }
            } elseif ($current[$name] -ne $value) {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
            }
        }
