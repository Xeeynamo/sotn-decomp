options:
  platform:     psx
  basename:     stwrp
  base_path:    ..
  build_path:   build/usproto
  target_path:  disks/usproto/ST/WRP/WRP.BIN
  asm_path:     asm/usproto/st/wrp
  asset_path:   assets/st/wrp
  src_path:     src/st/wrp
  ld_script_path: build/usproto/stwrp.ld
  compiler:     GCC
  symbol_addrs_path:
    - config/symbols.us.txt
    - config/symbols.usproto.stwrp.txt
  undefined_funcs_auto_path: build/usproto/config/undefined_funcs_auto.usproto.stwrp.txt
  undefined_syms_auto_path:  build/usproto/config/undefined_syms_auto.usproto.stwrp.txt
  find_file_boundaries: yes
  use_legacy_include_asm: no
  migrate_rodata_to_functions: no
  asm_jtbl_label_macro: jlabel
  extensions_path: tools/splat_ext
  disassemble_all: true
  global_vram_start: 0x80010000
  section_order:
    - ".data"
    - ".rodata"
    - ".text"
    - ".bss"
    - ".sbss"
  ld_generate_symbol_per_data_segment: true
sha1: 87afcda936a9cc9c71d19dfb826afedf4f2d15eb
