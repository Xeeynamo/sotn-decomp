options:
  target_path:  disks/saturn/TITLE.PRG
  asm_path:     asm/saturn/title
  src_path:     src/saturn
  obj_path:     build/saturn
  ld_scripts_path: config/saturn
  syms_path: config/saturn
  decomp_empty_funcs: true
  symbol_files:
    - game_user_syms.txt
    - zero_user_syms.txt
    - game_syms.gen.txt
    - zero_syms.gen.txt
segments:
  - name: title
    type: code
    start: 0x00000000
    vram:  0x060A5000
    subalign: 2
    subsegments:
      - start: 0x0
        type: .data
        file: title/header
        end: 0x577
      - start: 0x578
        type: c
        file: title
        end: 0x73A7
        function_ranges:
          - [0x578, 0x578]
          - [0x1540, 0x1540]
          - [0x61E0, 0x61E0]
      - start: 0x73A8
        type: .data
        file: title/data
        end: 0xE013
