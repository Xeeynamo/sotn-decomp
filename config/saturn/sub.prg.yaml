options:
  target_path:  disks/saturn/SUB.PRG
  asm_path:     asm/saturn/sub
  src_path:     src/saturn
  obj_path:     build/saturn
  ld_scripts_path: config/saturn
  syms_path: config/saturn
  decomp_empty_funcs: true
  symbol_files:
    - game_user_syms.txt
    - zero_user_syms.txt
    - game_syms.gen.txt
    - zero_syms.gen.txt
segments:
  - name: sub
    type: code
    start: 0x00000000
    vram:  0x060D6000
    subalign: 2
    subsegments:
      - start: 0x0
        type: .data
        file: sub/header
        end: 0x5F
      - start: 0x60
        type: c
        file: sub
        end: 0x411F
      - start: 0x4120
        type: .data
        file: sub/data
        end: 0x42C7
