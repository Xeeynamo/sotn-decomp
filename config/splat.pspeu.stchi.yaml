options:
  platform: psp
  basename: stchi
  base_path: ..
  build_path: build/pspeu
  target_path: disks/pspeu/PSP_GAME/USRDIR/res/ps/PSPBIN/chi.bin
  asm_path: asm/pspeu/st/chi_psp
  asset_path: assets/st/chi
  src_path: src/st/chi
  ld_script_path: build/pspeu/stchi.ld
  compiler: GCC
  symbol_addrs_path:
    - config/symbols.pspeu.txt
    - config/symbols.pspeu.stchi.txt
  undefined_funcs_auto_path: build/pspeu/config/undefined_funcs_auto.pspeu.stchi.txt
  undefined_syms_auto_path: build/pspeu/config/undefined_syms_auto.pspeu.stchi.txt
  find_file_boundaries: true
  use_legacy_include_asm: false
  migrate_rodata_to_functions: true
  asm_jtbl_label_macro: jlabel
  symbol_name_format: psp_$VRAM
  section_order:
    - .text
    - .data
    - .rodata
    - .bss
  ld_bss_is_noload: true
  disasm_unknown: true
  disassemble_all: true
  global_vram_start: 0x8000000
  asm_inc_header: |
    .set noat      /* allow manual use of $at */
    .set noreorder /* don't insert nops after branches */
  ld_generate_symbol_per_data_segment: true
