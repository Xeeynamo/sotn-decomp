options:
  platform:     psx
  basename:     stwrp
  base_path:    ..
  build_path:   build/jp11
  target_path:  disks/jp11/ST/WRP/WRP.BIN
  asm_path:     asm/jp11/st/wrp
  asset_path:   assets/st/wrp
  src_path:     src/st/wrp
  ld_script_path: build/jp11/stwrp.ld
  compiler:     GCC
  symbol_addrs_path:
    - config/symbols.jp10.txt
  undefined_funcs_auto_path: build/jp11/config/undefined_funcs_auto.jp11.stwrp.txt
  undefined_syms_auto_path:  build/jp11/config/undefined_syms_auto.jp11.stwrp.txt
  find_file_boundaries: yes
  use_legacy_include_asm: no
  migrate_rodata_to_functions: no
  asm_jtbl_label_macro: jlabel
  extensions_path: tools/splat_ext
  disassemble_all: true
  section_order:
    - ".data"
    - ".rodata"
    - ".text"
    - ".bss"
    - ".sbss"
  ld_generate_symbol_per_data_segment: true
sha1: 1f07cdf7473da1cfc5a0b25aaad0e8cd31f9531f
