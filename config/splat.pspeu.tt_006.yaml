options:
  platform: psp
  basename: tt_006
  base_path: ..
  build_path: build/pspeu
  target_path: disks/pspeu/PSP_GAME/USRDIR/res/ps/PSPBIN/tt_006.bin
  asm_path: asm/pspeu/servant/tt_006_psp
